name: Scheduled draws scraper + predictor ML

# NOTA: el agendado en producción es EXTERNO (cron-job.org para scrape/
# precompute/run/verify; Vercel Cron en vercel.json para premium-expiry).
# Este workflow es SOLO de disparo manual (workflow_dispatch) — no define
# `schedule:` a propósito para no duplicar los jobs externos. El job
# check-premium-expiry (antes gateado en un evento schedule que nunca ocurría,
# es decir, código muerto) fue eliminado: Vercel Cron lo cubre a diario.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha especifica (YYYY-MM-DD)'
        required: false
      history:
        description: 'Scrapear dias historicos (true/false)'
        required: false
        default: 'false'
      days:
        description: 'Cantidad de dias historicos (1-90)'
        required: false
        default: '7'
      skip_scrape:
        description: 'Saltar scrape y solo regenerar predicciones'
        required: false
        default: 'false'

jobs:
  fetch-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then echo "Missing APP_URL secret"; exit 1; fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then echo "Missing CRON_SECRET secret"; exit 1; fi

      # Nota: la URL lleva el secret pero NUNCA se imprime en logs (solo status/body).
      - name: Scrape today
        if: inputs.skip_scrape != 'true'
        run: |
          url="${{ secrets.APP_URL }}/api/cron-scrape?secret=${{ secrets.CRON_SECRET }}"
          response=$(curl -s -w "\n%{http_code}" "$url")
          http_code=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")
          echo "HTTP status: $http_code"
          echo "$body"
          if [ "$http_code" -ne 200 ]; then echo "ERROR: Scrape API returned $http_code"; exit 1; fi

      - name: Historical backfill (if triggered with history=true)
        if: inputs.history == 'true'
        run: |
          days="${{ inputs.days || '7' }}"
          url="${{ secrets.APP_URL }}/api/cron-backfill?secret=${{ secrets.CRON_SECRET }}&days=$days"
          response=$(curl -s -w "\n%{http_code}" "$url")
          http_code=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")
          echo "HTTP status: $http_code"
          echo "$body"
          if [ "$http_code" -ne 200 ]; then echo "ERROR: History API returned $http_code"; exit 1; fi

      - name: Trigger ML training via API
        run: |
          url="${{ secrets.APP_URL }}/api/cron-ml-training?secret=${{ secrets.CRON_SECRET }}"
          response=$(curl -s -w "\n%{http_code}" "$url")
          http_code=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")
          echo "HTTP status: $http_code"
          echo "$body"
          if [ "$http_code" -ne 200 ]; then echo "ERROR: ML training API returned $http_code"; exit 1; fi

      - name: Run analytics computation
        run: |
          url="${{ secrets.APP_URL }}/api/cron-analytics?secret=${{ secrets.CRON_SECRET }}"
          response=$(curl -s -w "\n%{http_code}" "$url")
          http_code=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")
          echo "HTTP status: $http_code"
          echo "$body"
          if [ "$http_code" -ne 200 ]; then echo "ERROR: Analytics API returned $http_code"; exit 1; fi
